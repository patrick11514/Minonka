name: CI

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    lint:
        name: 'Lint code & Test'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Cache node_modules
              uses: actions/cache@v3
              with:
                  path: node_modules
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Check lint
              run: pnpm run lint

            - name: TypeScript check
              run: pnpm run check

            - name: Setup Rust
              run: |
                  rustup update stable
                  rustup default stable

            - name: Cache assets
              uses: actions/cache@v3
              with:
                  path: |
                      assets/ddragon
                      assets/ranks
                      assets/lanes
                      assets/banners
                  key: ${{ runner.os }}-assets-${{ hashFiles('assets/download.sh') }}
                  restore-keys: |
                      ${{ runner.os }}-assets-

            - name: Download assets
              run: |
                  chmod +x ./assets/download.sh
                  ./assets/download.sh

            - name: Run worker tests
              run: pnpm run worker:test
            - name: Upload Visual Regression Diffs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-test-diffs
                  path: |
                      worker/src/tasks/snapshots/**/*.actual.png
                      worker/src/tasks/snapshots/**/*.diff.png
                  retention-days: 5

    deploy:
        name: Deploy
        needs: lint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: self-hosted
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  clean: false
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install & Build Frontend
              run: |
                  npm install -g pnpm
                  pnpm install --frozen-lockfile
                  pnpm run build
            - name: Check Rustup & Install if missing
              run: |
                  if ! command -v rustup &> /dev/null; then
                      if [ -f "$HOME/.cargo/env" ]; then
                          source "$HOME/.cargo/env"
                      fi
                  fi
                  if ! command -v rustup &> /dev/null; then
                      echo "Installing rustup..."
                      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                      source "$HOME/.cargo/env"
                  else
                      echo "rustup is already installed."
                  fi
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            - name: Build Rust worker
              run: |
                  source "$HOME/.cargo/env" || true
                  cd worker
                  cargo build --release --bin main
            - name: Sync Files
              run: |
                  rsync -av --delete ./ /opt/apps/Minonka/ \
                    --exclude .git \
                    --exclude node_modules \
                    --exclude .env \
                    --exclude "cache/" \
                    --exclude "logs/" \
                    --exclude "assets/banners/" \
                    --exclude "assets/ddragon/" \
                    --exclude "assets/lanes/" \
                    --exclude "assets/ranks/" \
                    --exclude "worker/target/"
            - name: Stop Worker
              run: |
                  sudo systemctl stop minonka_worker
            - name: Copy Rust binary
              run: |
                  mkdir -p /opt/apps/Minonka/worker/target/release
                  cp worker/target/release/main /opt/apps/Minonka/worker/target/release/main
            - name: Restart Application
              run: |
                  cd /opt/apps/Minonka
                  pnpm install
                  pnpm run migrate
                  pnpm run start:register
                  sudo systemctl restart minonka
                  sudo systemctl start minonka_worker
